<script>

/* =========================
   BOOKING STATE
========================= */

let currentStep = 1;

const STORAGE_KEY =
    "performanceGarageBookings";


/* =========================
   UPDATE PROGRESS
========================= */

function updateProgress() {

    const progressSteps =
        document.querySelectorAll(".progress-step");

    const labels =
        document.querySelectorAll(".step-labels span");

    progressSteps.forEach((step, index) => {

        step.classList.toggle(
            "active",
            index < currentStep
        );

    });

    labels.forEach((label, index) => {

        label.classList.toggle(
            "active",
            index === currentStep - 1
        );

    });

}


/* =========================
   SHOW STEP
========================= */

function showStep(step) {

    document
        .querySelectorAll(".booking-step")
        .forEach(section => {

            section.classList.remove("active");

        });

    const selectedStep =
        document.querySelector(
            `[data-step="${step}"]`
        );

    if (selectedStep) {

        selectedStep.classList.add("active");

    }

    currentStep = step;

    updateProgress();

    updateFinalPreview();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   NEXT STEP
========================= */

function nextStep() {

    if (currentStep === 1) {

        const make =
            document.getElementById("make").value;

        const model =
            document.getElementById("model").value.trim();

        if (!make || !model) {

            alert(
                "Please enter your vehicle make and model."
            );

            return;

        }

    }

    if (currentStep === 2) {

        const service =
            document.querySelector(
                'input[name="service"]:checked'
            );

        if (!service) {

            alert(
                "Please select a service."
            );

            return;

        }

    }

    if (currentStep === 3) {

        const date =
            document.getElementById("date").value;

        const time =
            document.getElementById("time").value;

        if (!date || !time) {

            alert(
                "Please select a preferred date and time."
            );

            return;

        }

    }

    if (currentStep < 4) {

        showStep(currentStep + 1);

    }

}


/* =========================
   PREVIOUS STEP
========================= */

function previousStep() {

    if (currentStep > 1) {

        showStep(currentStep - 1);

    }

}


/* =========================
   VEHICLE PREVIEW
========================= */

function updateVehiclePreview() {

    const make =
        document.getElementById("make").value;

    const model =
        document.getElementById("model").value.trim();

    const year =
        document.getElementById("year").value;

    const rego =
        document.getElementById("rego").value.trim();

    const vehicleParts = [];

    if (year) {
        vehicleParts.push(year);
    }

    if (make) {
        vehicleParts.push(make);
    }

    if (model) {
        vehicleParts.push(model);
    }

    document.getElementById(
        "previewVehicle"
    ).textContent =
        vehicleParts.length
            ? vehicleParts.join(" ")
            : "Not entered";

    document.getElementById(
        "previewRego"
    ).textContent =
        rego || "Not entered";

}


/* =========================
   FINAL PREVIEW
========================= */

function updateFinalPreview() {

    const make =
        document.getElementById("make").value;

    const model =
        document.getElementById("model").value.trim();

    const year =
        document.getElementById("year").value;

    const service =
        document.querySelector(
            'input[name="service"]:checked'
        );

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    const photo =
        document.getElementById("photo").files[0];

    const vehicle =
        `${year || ""} ${make || ""} ${model || ""}`.trim();

    document.getElementById(
        "finalVehicle"
    ).textContent =
        vehicle || "-";

    document.getElementById(
        "finalService"
    ).textContent =
        service
            ? service.value
            : "-";

    let appointment = "-";

    if (date && time) {

        const formattedDate =
            new Date(
                date + "T00:00:00"
            ).toLocaleDateString(
                "en-NZ",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        appointment =
            `${formattedDate} • ${time}`;

    }

    document.getElementById(
        "finalAppointment"
    ).textContent =
        appointment;

    document.getElementById(
        "finalPhoto"
    ).textContent =
        photo
            ? "Attached ✓"
            : "None";

}


/* =========================
   LIVE LISTENERS
========================= */

document
    .getElementById("make")
    .addEventListener(
        "change",
        updateVehiclePreview
    );

document
    .getElementById("model")
    .addEventListener(
        "input",
        updateVehiclePreview
    );

document
    .getElementById("year")
    .addEventListener(
        "input",
        updateVehiclePreview
    );

document
    .getElementById("rego")
    .addEventListener(
        "input",
        updateVehiclePreview
    );

document
    .getElementById("photo")
    .addEventListener(
        "change",
        function() {

            const file =
                this.files[0];

            document.getElementById(
                "photoName"
            ).textContent =
                file
                    ? `Selected: ${file.name}`
                    : "";

            updateFinalPreview();

        }
    );

document
    .querySelectorAll(
        'input[name="service"]'
    )
    .forEach(radio => {

        radio.addEventListener(
            "change",
            updateFinalPreview
        );

    });

document
    .getElementById("date")
    .addEventListener(
        "change",
        updateFinalPreview
    );

document
    .getElementById("time")
    .addEventListener(
        "change",
        updateFinalPreview
    );


/* =========================
   SUBMIT BOOKING
========================= */

function submitBooking() {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    if (!name || !phone || !email) {

        alert(
            "Please complete your contact details."
        );

        return;

    }

    const make =
        document.getElementById("make").value;

    const model =
        document.getElementById("model").value.trim();

    const year =
        document.getElementById("year").value;

    const rego =
        document.getElementById("rego").value.trim();

    const mileage =
        document.getElementById("mileage").value.trim();

    const issue =
        document.getElementById("issue").value.trim();

    const service =
        document.querySelector(
            'input[name="service"]:checked'
        );

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    if (!service || !date || !time) {

        alert(
            "Please complete your service and appointment details."
        );

        return;

    }

    const formattedDate =
        new Date(
            date + "T00:00:00"
        ).toLocaleDateString(
            "en-NZ",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    const vehicle =
        `${year || ""} ${make} ${model}`.trim();

    const serviceName =
        service.value;

    const appointment =
        `${formattedDate} • ${time}`;

    const photo =
        document.getElementById("photo").files[0];


    /* =========================
       CREATE BOOKING
    ========================= */

    const booking = {

        id:
            "PG-" +
            Date.now()
                .toString()
                .slice(-8),

        createdAt:
            new Date().toISOString(),

        status:
            "New",

        name,
        phone,
        email,

        make,
        model,
        year,
        rego,
        mileage,

        vehicle,

        service:
            serviceName,

        date:
            formattedDate,

        time,

        appointment,

        issue,

        photo:
            photo
                ? photo.name
                : ""

    };


    /* =========================
       SAVE TO DASHBOARD
    ========================= */

    const existingBookings =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );


    existingBookings.unshift(
        booking
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            existingBookings
        )
    );


    /* =========================
       KEEP CURRENT DEMO BOOKING
    ========================= */

    window.demoBooking =
        booking;


    /* =========================
       CONFIRMATION
    ========================= */

    document.getElementById(
        "confirmName"
    ).textContent =
        name;

    document.getElementById(
        "confirmVehicle"
    ).textContent =
        `${vehicle}${rego ? " • " + rego : ""}`;

    document.getElementById(
        "confirmService"
    ).textContent =
        serviceName;

    document.getElementById(
        "confirmAppointment"
    ).textContent =
        appointment;

    document.getElementById(
        "confirmIssue"
    ).textContent =
        issue || "No issue provided";

    document.getElementById(
        "confirmContact"
    ).textContent =
        phone;


    document
        .querySelectorAll(
            ".booking-step"
        )
        .forEach(section => {

            section.classList.remove("active");

        });


    document
        .getElementById("confirmation")
        .classList.add("active");


    document.querySelector(
        ".progress"
    ).style.display =
        "none";

    document.querySelector(
        ".step-labels"
    ).style.display =
        "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   SEND SMS
========================= */

function sendBookingSMS() {

    if (!window.demoBooking) {

        alert(
            "Please complete a booking first."
        );

        return;

    }

    const booking =
        window.demoBooking;

    const message =
`🚗 PERFORMANCE GARAGE
NEW BOOKING REQUEST

BOOKING ID
${booking.id}

CUSTOMER
${booking.name}
${booking.phone}
${booking.email}

VEHICLE
${booking.vehicle}
Registration: ${booking.rego || "Not provided"}
Mileage: ${booking.mileage || "Not provided"}

SERVICE
${booking.service}

PREFERRED APPOINTMENT
${booking.appointment}

CUSTOMER MESSAGE
${booking.issue || "No additional message provided."}

PHOTO
${booking.photo || "No photo attached"}

Submitted via ManaU Digital demo.`;

    const recipient =
        "+642108839107";

    const smsURL =
        "sms:" +
        recipient +
        "&body=" +
        encodeURIComponent(message);

    const smsLink =
        document.createElement("a");

    smsLink.href =
        smsURL;

    smsLink.style.display =
        "none";

    document.body.appendChild(
        smsLink
    );

    smsLink.click();

    setTimeout(
        () => smsLink.remove(),
        1000
    );

}


/* =========================
   MINIMUM DATE
========================= */

const dateInput =
    document.getElementById("date");

const today =
    new Date()
        .toISOString()
        .split("T")[0];

dateInput.min =
    today;


/* =========================
   INITIALISE
========================= */

updateVehiclePreview();

updateFinalPreview();

</script>
